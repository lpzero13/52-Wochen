[project]
name = "52w-high-research"
version = "0.2.0"
description = "Unabhängiges historisches Research zu Aktien nahe ihrem 52-Wochen-Hoch"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.30,<2",
  "yfinance>=0.2.66,<2",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "exchange-calendars>=4.5,<5",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "tzdata>=2025.1",
]

[tool.ruff]
line-length = 100
